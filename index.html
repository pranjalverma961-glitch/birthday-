<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cinematic Birthday Wish 🎂</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins',sans-serif;
      overflow:hidden;
      height:100vh;
      background:#000;
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
      position:relative;
    }

    /* Animated Gradient Background */
    .bg{
      position:absolute;
      width:100%;
      height:100%;
      background:linear-gradient(-45deg,#ff0080,#7928ca,#2af598,#009efd);
      background-size:400% 400%;
      animation:gradientMove 12s ease infinite;
      z-index:-3;
    }

    @keyframes gradientMove{
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }

    /* Floating Lights */
    .lights span{
      position:absolute;
      width:8px;
      height:8px;
      background:white;
      border-radius:50%;
      box-shadow:0 0 15px white;
      animation:float 10s linear infinite;
      opacity:0.7;
    }

    @keyframes float{
      0%{
        transform:translateY(100vh) scale(0);
      }
      100%{
        transform:translateY(-120vh) scale(1.5);
      }
    }

    /* Glass Card */
    .card{
      width:90%;
      max-width:600px;
      padding:40px 25px;
      border-radius:30px;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,0.15);
      text-align:center;
      box-shadow:0 0 40px rgba(255,255,255,0.15);
      animation:fadeIn 2s ease;
      position:relative;
      overflow:hidden;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(40px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    /* Shine Effect */
    .card::before{
      content:"";
      position:absolute;
      top:-100%;
      left:-100%;
      width:200%;
      height:200%;
      background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.25),
        transparent
      );
      transform:rotate(25deg);
      animation:shine 5s infinite;
    }

    @keyframes shine{
      0%{
        transform:translateX(-100%) rotate(25deg);
      }
      100%{
        transform:translateX(100%) rotate(25deg);
      }
    }

    h1{
      font-size:4rem;
      font-family:'Great Vibes',cursive;
      margin-bottom:10px;
      animation:glow 2s infinite alternate;
    }

    @keyframes glow{
      from{
        text-shadow:0 0 10px #fff;
      }
      to{
        text-shadow:
          0 0 20px #fff,
          0 0 40px #ff69b4,
          0 0 60px #ff1493;
      }
    }

    .cake{
      font-size:6rem;
      margin:20px 0;
      animation:bounce 2s infinite;
    }

    @keyframes bounce{
      0%,100%{
        transform:translateY(0);
      }
      50%{
        transform:translateY(-15px);
      }
    }

    .message{
      font-size:1.15rem;
      line-height:1.8;
      margin-bottom:30px;
      opacity:0;
      animation:typewriter 4s forwards;
      animation-delay:1s;
    }

    @keyframes typewriter{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .btn{
      padding:15px 35px;
      border:none;
      border-radius:50px;
      background:linear-gradient(45deg,#ff0080,#ff8c00);
      color:white;
      font-size:1rem;
      font-weight:600;
      cursor:pointer;
      transition:0.4s;
      box-shadow:0 0 20px rgba(255,255,255,0.3);
    }

    .btn:hover{
      transform:scale(1.1);
      box-shadow:0 0 30px rgba(255,255,255,0.7);
    }

    .footer{
      margin-top:20px;
      font-size:0.9rem;
      opacity:0.8;
    }

    /* Responsive */
    @media(max-width:600px){

      h1{
        font-size:3rem;
      }

      .cake{
        font-size:4.5rem;
      }

      .message{
        font-size:1rem;
      }

      .card{
        padding:30px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Animated Background -->
  <div class="bg"></div>

  <!-- Floating Lights -->
  <div class="lights"></div>

  <!-- Main Card -->
  <div class="card">

    <h1>Happy Birthday</h1>

    <div class="cake">🎂</div>

    <div class="message">
      On this beautiful day, may your heart be filled with joy,
      your dreams shine brighter than stars,
      and your smile light up the world forever ✨💖
    </div>

    <button class="btn" onclick="megaCelebration()">
      Celebrate 🎉
    </button>

    <div class="footer">
      Made with ❤️ and cinematic vibes
    </div>

  </div>

  <script>

    // Floating lights
    const lights = document.querySelector('.lights');

    for(let i = 0; i < 40; i++){
      let light = document.createElement('span');

      light.style.left = Math.random() * 100 + 'vw';
      light.style.animationDuration = (5 + Math.random() * 10) + 's';
      light.style.opacity = Math.random();

      let size = 2 + Math.random() * 8;
      light.style.width = size + 'px';
      light.style.height = size + 'px';

      lights.appendChild(light);
    }

    // Confetti Function
    function megaCelebration(){

      // Main burst
      confetti({
        particleCount:250,
        spread:120,
        startVelocity:60,
        scalar:1.2,
        origin:{ y:0.6 }
      });

      // Side bursts
      confetti({
        particleCount:120,
        angle:60,
        spread:90,
        origin:{ x:0 }
      });

      confetti({
        particleCount:120,
        angle:120,
        spread:90,
        origin:{ x:1 }
      });

      // Continuous cinematic rain
      let duration = 4000;
      let animationEnd = Date.now() + duration;

      let interval = setInterval(function() {

        if (Date.now() > animationEnd) {
          return clearInterval(interval);
        }

        confetti({
          particleCount:8,
          startVelocity:30,
          spread:360,
          ticks:60,
          origin:{
            x:Math.random(),
            y:Math.random() - 0.2
          }
        });

      }, 180);
    }

    // Auto Start
    window.onload = () => {
      megaCelebration();
    }

  </script>

</body>
</html>
